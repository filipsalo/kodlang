# How programs are linked. The Makefile includes this file and tools/kod.kod
# reads it, so both link the same way. The format is in docs/self-hosting.md
# ("The link configuration"): one `NAME := word word ...` per line and nothing
# else. link.local.cfg (untracked) is read after it and overrides single names
# on one machine.

# Links an executable. clang finds the SDK and the macOS version.
LINK := clang -target arm64-apple-darwin -Wl,-dead_strip

# Compiles a C file. The target is pinned as in LINK.
CC := clang
CFLAGS := -target arm64-apple-darwin -I stdlib -O2

# C files linked into every program, built to build/stage0/<name>.o.
RUNTIME_C := stdlib/arena.c stdlib/rc.c stdlib/runtime.c

# Kod modules linked into every program, in link order, built to
# build/stage0/_<basename>.o, so their basenames must be unique.
STAGE0_KOD := stdlib/builtins.kod stdlib/primitives/int64.kod stdlib/primitives/str.kod stdlib/primitives/bool.kod stdlib/primitives/float_text.kod stdlib/primitives/float64.kod stdlib/primitives/int64_float.kod stdlib/primitives/str_float.kod stdlib/io.kod stdlib/process.kod stdlib/time.kod stdlib/kod/inspect.kod

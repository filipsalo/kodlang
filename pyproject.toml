[project]
name = "kod"
version = "0.1.0"
dependencies = [
  "mypy",
]
requires-python = ">=3.13"

[tool.ruff]
builtins = ["dbg"]

[tool.ruff.lint]
extend-select = [
  "I",  # isort
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "pytest>=8.3.2",
    "pyright>=1.1.377",
    "prek>=0.3.9",
    "pytest-xdist>=3.8.0",
]
